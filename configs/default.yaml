# Default conversion settings. Pass this file with --config to make the
# selected profile explicit, or create a project-specific copy.
conversion:
  lanelet2_routing_enrichment: true
  osm_extract_sublayer: true
  opendrive_version: "1.6.1"

# Lanelet2 -> Raster output profile.
raster:
  resolution_m: 0.5
  padding_m: 5.0
  supersampling: 4
  topology_tolerance_m: 1.0
  max_output_pixels: 40000000
